<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHI beköltözés — Visszaszámláló</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --event: "KHI beköltözés";
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 28px 16px 60px;
    transition: background 0.6s ease, color 0.4s ease;
    overflow-x: hidden;
  }

  /* ---------- Téma-választó sáv ---------- */
  .theme-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 34px;
    z-index: 20;
  }
  .theme-bar button {
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1.5px solid rgba(128,128,128,0.35);
    background: rgba(128,128,128,0.10);
    color: inherit;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .theme-bar button:hover { transform: translateY(-2px); }
  .theme-bar button.active {
    background: currentColor;
    border-color: currentColor;
  }
  .theme-bar button.active span { mix-blend-mode: difference; color: #fff; }

  /* ---------- Közös elrendezés ---------- */
  .stage {
    width: 100%;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    flex: 1;
    justify-content: center;
  }

  .kicker {
    text-transform: uppercase;
    letter-spacing: 0.35em;
    font-size: 0.72rem;
    font-weight: 700;
    opacity: 0.7;
    margin-bottom: 12px;
  }
  .title {
    font-size: clamp(2rem, 7vw, 3.6rem);
    font-weight: 800;
    line-height: 1.05;
    margin-bottom: 6px;
  }
  .date-line {
    font-size: 1rem;
    opacity: 0.75;
    margin-bottom: 40px;
    letter-spacing: 0.04em;
  }

  .timer {
    display: flex;
    gap: clamp(10px, 3vw, 26px);
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 30px;
  }
  .unit {
    min-width: clamp(74px, 18vw, 150px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .num {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    line-height: 1;
    font-size: clamp(2.6rem, 11vw, 5.4rem);
  }
  .label {
    margin-top: 12px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 0.72rem;
    font-weight: 600;
    opacity: 0.7;
  }

  .big-days {
    font-variant-numeric: tabular-nums;
    font-weight: 900;
    line-height: 0.9;
    font-size: clamp(6rem, 34vw, 20rem);
  }
  .big-days-label {
    text-transform: uppercase;
    letter-spacing: 0.3em;
    font-size: 0.9rem;
    font-weight: 700;
    opacity: 0.7;
    margin-top: 6px;
  }

  .subline { margin-top: 8px; font-size: 0.95rem; opacity: 0.72; }

  .progress-wrap { width: min(520px, 90%); margin-top: 34px; }
  .progress-track {
    height: 10px; border-radius: 999px;
    background: rgba(128,128,128,0.22); overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 999px;
    transition: width 0.6s ease;
  }
  .progress-meta {
    display: flex; justify-content: space-between;
    font-size: 0.75rem; opacity: 0.65; margin-top: 8px;
    letter-spacing: 0.03em;
  }

  .done-msg { font-size: clamp(1.6rem, 6vw, 3rem); font-weight: 800; }

  .foot {
    margin-top: 46px; font-size: 0.78rem; opacity: 0.5; text-align: center;
    line-height: 1.6;
  }
  .foot a { color: inherit; }

  /* ==================================================== */
  /*  1) NEON — sötét üveghatás, ragyogó számok           */
  /* ==================================================== */
  body.theme-neon {
    background: radial-gradient(1200px 700px at 50% -10%, #1b2a52 0%, #0a0e1f 55%, #05060d 100%);
    color: #eaf0ff;
  }
  body.theme-neon .kicker { color: #63e6ff; }
  body.theme-neon .title {
    background: linear-gradient(90deg, #8be9ff, #b78bff 55%, #ff8bd0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  body.theme-neon .unit {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(139,233,255,0.20);
    border-radius: 20px;
    padding: 22px 8px 16px;
    box-shadow: 0 0 40px rgba(60,120,255,0.10), inset 0 0 30px rgba(120,180,255,0.05);
    backdrop-filter: blur(8px);
  }
  body.theme-neon .num {
    color: #fff;
    text-shadow: 0 0 12px rgba(120,200,255,0.8), 0 0 34px rgba(120,140,255,0.55);
  }
  body.theme-neon .progress-fill {
    background: linear-gradient(90deg, #63e6ff, #b78bff, #ff8bd0);
    box-shadow: 0 0 16px rgba(120,180,255,0.7);
  }

  /* ==================================================== */
  /*  2) NAPFELKELTE — meleg animált színátmenet           */
  /* ==================================================== */
  body.theme-sunset {
    background: linear-gradient(135deg, #ff9a56, #ff5e7e 40%, #b14bd8 75%, #6a3ce0);
    background-size: 300% 300%;
    animation: sunsetMove 14s ease infinite;
    color: #fff;
  }
  @keyframes sunsetMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  body.theme-sunset .kicker { color: rgba(255,255,255,0.85); }
  body.theme-sunset .unit {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 22px;
    padding: 26px 10px 18px;
    box-shadow: 0 20px 40px rgba(120,20,80,0.25);
    backdrop-filter: blur(4px);
  }
  body.theme-sunset .num { color: #fff; text-shadow: 0 3px 14px rgba(80,0,60,0.35); }
  body.theme-sunset .progress-fill { background: #fff; }

  /* ==================================================== */
  /*  3) MINIMÁL — világos, egyetlen nagy szám             */
  /* ==================================================== */
  body.theme-minimal { background: #f4f4f2; color: #16181d; }
  body.theme-minimal .kicker { color: #b8842c; }
  body.theme-minimal .title { color: #16181d; }
  body.theme-minimal .big-days {
    background: linear-gradient(180deg, #16181d, #565b66);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  body.theme-minimal .progress-fill { background: #16181d; }

  /* ==================================================== */
  /*  4) FLIP — retro kijelző, sötét kártyák               */
  /* ==================================================== */
  body.theme-flip { background: #101216; color: #f2f4f8; }
  body.theme-flip .kicker { color: #ffcf5c; }
  body.theme-flip .title { color: #fff; }
  body.theme-flip .unit { gap: 0; }
  body.theme-flip .num {
    background: linear-gradient(180deg, #2a2e37 0%, #1a1d24 49%, #14161c 51%, #23272f 100%);
    color: #fff;
    padding: 18px clamp(10px, 3vw, 24px);
    border-radius: 14px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative;
    min-width: clamp(76px, 18vw, 150px);
  }
  body.theme-flip .num::after {
    content: ""; position: absolute; left: 8px; right: 8px; top: 50%;
    height: 2px; transform: translateY(-1px);
    background: rgba(0,0,0,0.55);
  }
  body.theme-flip .progress-fill { background: linear-gradient(90deg, #ffcf5c, #ff9f45); }

  @media (max-width: 420px) {
    .theme-bar button { padding: 8px 12px; font-size: 0.76rem; }
  }
</style>
</head>
<body class="theme-neon">

  <nav class="theme-bar" id="themeBar">
    <button data-theme="theme-neon" class="active"><span>✦ Neon</span></button>
    <button data-theme="theme-sunset"><span>☀ Napfelkelte</span></button>
    <button data-theme="theme-minimal"><span>◻ Minimál</span></button>
    <button data-theme="theme-flip"><span>▦ Flip</span></button>
  </nav>

  <main class="stage">
    <div class="kicker">Visszaszámlálás</div>
    <h1 class="title">KHI beköltözés</h1>
    <div class="date-line" id="dateLine">2026. október 7.</div>

    <!-- Sokszámjegyes nézet (Neon / Napfelkelte / Flip) -->
    <div class="timer" id="fullTimer">
      <div class="unit"><div class="num" id="d">--</div><div class="label">Nap</div></div>
      <div class="unit"><div class="num" id="h">--</div><div class="label">Óra</div></div>
      <div class="unit"><div class="num" id="m">--</div><div class="label">Perc</div></div>
      <div class="unit"><div class="num" id="s">--</div><div class="label">Másodperc</div></div>
    </div>

    <!-- Egyszámos nézet (Minimál) -->
    <div id="minimalView" style="display:none;">
      <div class="big-days" id="bigDays">--</div>
      <div class="big-days-label">nap van hátra</div>
      <div class="subline" id="minimalSub"></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-meta">
        <span id="pctText">0%</span>
        <span id="daysText"></span>
      </div>
    </div>

    <div class="foot">
      Az esemény időpontja: <strong>2026.10.07.</strong> · Válts stílust a fenti gombokkal.<br>
      My Budget Book · <a href="index.html">Adatvédelmi szabályzat</a>
    </div>
  </main>

<script>
  // ---- Beállítások ----
  var EVENT_NAME = "KHI beköltözés";
  var TARGET = new Date(2026, 9, 7, 0, 0, 0); // 2026. október 7. (hónap 0-indexelt: 9 = október)
  // A visszaszámlálás kezdőpontja a haladássávhoz (ettől számítjuk a 100%-ot):
  var START = new Date(2026, 6, 23, 0, 0, 0);  // 2026. július 23.

  var pad = function (n) { return (n < 10 ? "0" : "") + n; };

  var el = {
    d: document.getElementById("d"),
    h: document.getElementById("h"),
    m: document.getElementById("m"),
    s: document.getElementById("s"),
    bigDays: document.getElementById("bigDays"),
    minimalSub: document.getElementById("minimalSub"),
    fill: document.getElementById("progressFill"),
    pct: document.getElementById("pctText"),
    daysText: document.getElementById("daysText"),
    fullTimer: document.getElementById("fullTimer"),
    minimalView: document.getElementById("minimalView"),
    stage: document.querySelector(".stage")
  };

  function tick() {
    var now = new Date();
    var diff = TARGET - now;

    if (diff <= 0) {
      el.fullTimer.innerHTML = '<div class="done-msg">🎉 Elérkezett a nap — jó beköltözést!</div>';
      el.minimalView.innerHTML = '<div class="done-msg">🎉 Megérkeztünk!</div>';
      el.fill.style.width = "100%";
      el.pct.textContent = "100%";
      el.daysText.textContent = "";
      return;
    }

    var totalSec = Math.floor(diff / 1000);
    var days = Math.floor(totalSec / 86400);
    var hours = Math.floor((totalSec % 86400) / 3600);
    var mins = Math.floor((totalSec % 3600) / 60);
    var secs = totalSec % 60;

    el.d.textContent = days;
    el.h.textContent = pad(hours);
    el.m.textContent = pad(mins);
    el.s.textContent = pad(secs);

    el.bigDays.textContent = days;
    el.minimalSub.textContent =
      pad(hours) + " óra " + pad(mins) + " perc " + pad(secs) + " mp";

    // Haladássáv
    var span = TARGET - START;
    var elapsed = now - START;
    var pct = Math.max(0, Math.min(100, (elapsed / span) * 100));
    el.fill.style.width = pct.toFixed(2) + "%";
    el.pct.textContent = Math.round(pct) + "% eltelt";
    el.daysText.textContent = days + " nap hátra";
  }

  // ---- Téma-váltás ----
  var buttons = document.querySelectorAll("#themeBar button");
  function setTheme(name) {
    document.body.className = name;
    buttons.forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-theme") === name);
    });
    var minimal = (name === "theme-minimal");
    el.fullTimer.style.display = minimal ? "none" : "flex";
    el.minimalView.style.display = minimal ? "block" : "none";
    try { localStorage.setItem("khiTheme", name); } catch (e) {}
  }
  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      setTheme(b.getAttribute("data-theme"));
    });
  });

  // Mentett téma visszatöltése
  var saved = null;
  try { saved = localStorage.getItem("khiTheme"); } catch (e) {}
  if (saved) setTheme(saved);

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
